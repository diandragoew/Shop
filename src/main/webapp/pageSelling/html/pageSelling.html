<script>
    getUrl("/ads", function (data) {
        var ads = JSON.parse(data);
        console.log(ads);
          var table = document.getElementsByClassName("tablePageSelling")[0];

        for (var i = 0; i < ads.length; i++) {
          var newRow = table.insertRow(i+1);
          newRow.insertCell(0).innerHTML = ads[i].titleAd;
          var photoPath = ads[i].photos.length > 0 ? ads[i].photos[0] : null;

          var photo = "<img src='" + photoPath + "' alt='obqva' width='300' height='300'></a>"
          newRow.insertCell(1).innerHTML = photo;
          newRow.insertCell(2).innerHTML = "<a href='/publicUserProfil/html/publicUserProfil.html'><p>"+ads[i].userName+"</p></a>";
          newRow.insertCell(3).innerHTML = ads[i].phone;
          newRow.insertCell(4).innerHTML = "<form method='POST' action='/submit-form' id='tablePageSelling_message'><textarea class='tablePageSelling_message--text' type='text' rows='4' cols='20'></textarea><input class='tablePageSelling_message--send' type='submit'></form>";
        }
    });

    function getUrl(url, callback) {
        var req = new XMLHttpRequest();
        req.open("GET", url, true);
        req.addEventListener("load", function () {
            if (req.status < 400)
                callback(req.responseText);
            else
                callback(null, new Error("Request failed: " +
                    req.statusText));
        });
        req.addEventListener("error", function () {
            callback(null, new Error("Network error"));
        });
        req.send(null);
    }
</script>
