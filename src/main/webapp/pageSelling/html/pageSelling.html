<!DOCTYPE html>
<html>

<head>
    <title>sergiya.bg</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="/pageSelling/css/style.css">
</head>

<body>
    <header class="headerSection">
        <h1><a href="/homePage/html/home.html">Сергия BG</a></h1>
    </header>
    <h2>
        обяви
    </h2>
    <table class="tablePageSelling">
        <tr>
            <th>заглавие</th>
            <th>снимка</th>
            <th>price</th>
            <th>потребител</th>
            <th>телефон</th>
            <th>съобщение</th>
        </tr>

    </table>

    <footer id="footerSection">

    </footer>


    <script src="/js/api.js"></script>
    <script>
        getUrl("/ads", function (data) {
            var ads = JSON.parse(data);
            console.log(ads);
            var table = document.getElementsByClassName("tablePageSelling")[0];

            for (var i = 0; i < ads.length; i++) {
                var newRow = table.insertRow(i + 1);

                var ad = ads[i];
                newRow.insertCell(0).innerHTML = `<a href="/adPage/html/adPage.html?adId=${ad.id}"><p>${ad.titleAd}</p></a>`;


                var photoPath = ad.photos.length > 0 ? ad.photos[0] : null;

                var photo = "<img src='" + photoPath + "' alt='obqva' width='300' height='300'></a>"
                newRow.insertCell(1).innerHTML = photo;
                var price = ad.price;
                newRow.insertCell(2).innerHTML = price === null ? "Price: 0" : "Price: " + price;

                newRow.insertCell(3).innerHTML = "<a href='/publicUserProfil/html/publicUserProfil.html'><p>" + ad.creatorName + "</p></a>";
                newRow.insertCell(4).innerHTML = ad.phone;
                var creatorAdId = ad.creatorId;
                var loggedUserId = ad.loggedUserId;

                if(loggedUserId !== null && creatorAdId !== loggedUserId){
                newRow.insertCell(5).innerHTML = `
                <form method="POST" action="/createMessage" id='tablePageSelling_message' >
                    <textarea class="tablePageSelling_message--text" name="text" rows="4" cols="20"></textarea>
                    <input type="hidden" name="adId" value="${ad.id}">
                    <input type="hidden" name="creatorAdId" value="${creatorAdId}">
                    <input class="tablePageSelling_message--send" type="submit">
                </form>
                `;
                }

            }
        });


document.addEventListener("submit", function(event) {
    if (event.target && event.target.matches("form[id='tablePageSelling_message']")) {
        event.preventDefault(); // Prevents the page from reloading

        let formData = new FormData(event.target);

        fetch("/createMessage", {
            method: "POST",
            body: formData
        })
        .then(response => {
            if (response.ok) {
                alert("Message sent successfully!");
            } else {
                alert("Error sending message.");
            }
        })
        .catch(error => console.error("Error:", error));
    }
});
    </script>
</body>

</html>
