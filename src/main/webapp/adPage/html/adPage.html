<!DOCTYPE html>
<html>

<head>
    <title id="pageTitle">sergiya.bg</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="/adPage/css/style.css">
</head>

<body>
    <header class="headerSection">
        <h1><a href="/homePage/html/home.html">Сергия BG</a></h1>
    </header>
    <div class="advertisement">
        <div class="adPageAndMessages">
        <table class="tableAdPage">
            <tr>
                <th class="tableAdPage__title">заглавие</th>
                <th>описание</th>
                <th>price</th>
                <th>снимка</th>
                <th>потребител</th>
                <th>телефон</th>
                <th id="tableAdPage__message__title">съобщение</th>

            </tr>
            <tr id = "tableAd__cells">
                <td id="adTitle"></td>
                <td id="adDescription"></td>
                <td id="adPrice"></td>
                <td>
                    <div id="adPhotos"></div>
                </td>
                <td><a id="creatorLink" href="">
                        <p id="creatorName"></p>
                    </a></td>
                <td id="adPhone"></td>
                <td>
                    <form method="POST" action="/submit-form" id="tableAdPage_message">
                        <textarea class="tableAdPage_message--text" name="text" rows="4" cols="20"></textarea>
                        <input class="tableAdPage_message--send" type="submit">
                    </form>
                </td>
                <td class="ProcessAd">
                    <table class="tableProcessAd">
                        <tr>
                            <td>
                                <button class="tableProcessAd__edit" id="editAdLink">редакция</button>
                            </td>

                        </tr>
                        <tr>
                            <td>
                                <button class="tableProcessAd__delete" id="deleteAdLink"> изтрий</button>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>

        <table class="table__messages__adPage" id="tableMessagesAdPage">
            <tr class="table__messages__adPage__header">
                <th colspan="4" style="text-align: center;">съобщения</th>
            </tr>
            <tr class="table__messages__adPage__columns">
                <th class="table__messages__adPage__header__counterpart"></th>
                <th>date</th>
                <th>sender</th>
                <th>messages</th>
            </tr>
            <tr class="more-messages-row">
                <td colspan="4" style="text-align: left;">
                    <button class="moreMessages">още съобщения...</button>
                </td>
            </tr>
        </table>
        </div>

        <template id="messagesAdPageTemplate">
            <table class="table__messages__adPage">
                <tr class="table__messages__adPage__header">
                    <th colspan="3" style="text-align: center;">съобщения</th>
                </tr>
                <tr class="table__messages__adPage__columns">
                    <th>date</th>
                    <th>sender</th>
                    <th>messages</th>
                </tr>
            </table>
        </template>

        <h2 class="morePhotos">още снимки</h2>
        <ol class="listPhotos" id="morePhotosList">
        </ol>
    </div>

    <template id="editAd__template">
        <div class="editAd">
            <h2 class="form-heading">редактиране на обява</h2>
            <form id="editAd__form" method="post" action="/edit-ad" enctype="multipart/form-data">
                <table class="editAd__table">
                    <tr>
                        <td><input type="text" name="title" required placeholder="заглавие"></td>
                        <td><textarea name="description" placeholder="описание"></textarea></td>
                        <td><input type="text" name="price" placeholder="price"></td>
                        <td><input type="number" name="phone" placeholder="телефон"></td>
                        <td><input type="file" id="photos" name="photos" multiple accept="image/*"></td>
                    </tr>
                    <tr>
                        <td class="emptyCell"></td>
                        <td><input type="submit" value="edit"></td>
                        <td><a id="editAd__cancel" class="form-btn" href="/adPage/html/adPage.html">откажи</a></td>
                        <td class="emptyCell"></td>
                    </tr>
                </table>
            </form>
        </div>
    </template>
    <template id="deleteConfirmationFormTemplate">
        <div id="deleteConfirmationForm">
            <p>искате ли да изтриете обявата ?</p>
            <button id="deleteConfirmationForm__yes">yes</button>
            <button id="deleteConfirmationForm__no">no</button>
        </div>
    </template>

    <footer id="footerSection">

    </footer>

    <script>
        let adDtoGlobal = null;
        var globalMessagesByAd = [];
        var globalShownMessagesByAd = {};
        var isAdOwner = false;

        // Place all your functions and event listeners in a single script block

        // This function displays the edit form
        function displayEditAd(event) {
            const editButton = event.target.closest('.tableProcessAd__edit');

            if (editButton) {
                const urlParams = new URLSearchParams(window.location.search);
                const adId = urlParams.get('adId');

                if (adId) {
                    const tableAdPage = document.querySelector('.tableAdPage');
                    const editAdTemplate = document.getElementById('editAd__template');

                    // Clone the template's content
                    const clone = editAdTemplate.content.cloneNode(true);

                    // Get the form element *from the clone*
                    const editForm = clone.querySelector('#editAd__form');
                    editForm.title.value = adDtoGlobal.titleAd;
                    editForm.description.value = adDtoGlobal.descriptionAd;
                    editForm.price.value = adDtoGlobal.price;
                    editForm.phone.value = adDtoGlobal.phone;

                    // Now, insert the cloned content into the live DOM
                    tableAdPage.after(clone);

                    const editAdCancel = document.getElementById('editAd__cancel');
                    editAdCancel.href = `/adPage/html/adPage.html?adId=${adId}`;

                    // Attach the submit listener to the form element you just found
                    if (editForm) {
                        editForm.addEventListener("submit", editAd);
                    }

                    // You can remove the click listener to prevent multiple forms
                    document.removeEventListener("click", displayEditAd);
                }
            }
        }

        function editAd(event) {
            event.preventDefault(); // Prevent page reload

            let formData = new FormData(event.currentTarget); // currentTarget is the form

            // Add adId to formData
            const urlParams = new URLSearchParams(window.location.search);
            const adId = urlParams.get('adId');
            if (adId) {
                formData.append('adId', adId);
            }

            fetch("/edit-ad", {
                method: "POST",
                body: formData
            })
                .then(response => {
                    if (response.ok) {
                        alert("Ad edited successfully!");
                        window.location.reload();
                    } else if (response.status === 401) {
                        alert("The ad was not edited because you are not logged in!");
                    } else if (response.status === 404) {
                        alert("The ad was not edited because that ad is not yours!");
                    } else {
                        alert("Error editing ad.");
                    }
                })
                .catch(error => console.error("Error:", error));
        }


        // This listener fetches initial ad details on page load
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const adId = urlParams.get('adId');

            if (adId) {
                fetch(`/ad-details?adId=${adId}`)
                    .then(response => {
                        if (!response.ok) {
                        let tableAdCells = document.getElementById('tableAd__cells');
                        tableAdCells.style.display = 'none';
                          console.error("no add");
                        }
                        return response.json();
                    })
                    .then(adDto => {
                        // Store in global variable
                        adDtoGlobal = adDto;
                        document.getElementById('pageTitle').innerText = adDto.titleAd;
                        document.getElementById('adTitle').innerText = adDto.titleAd;
                        document.getElementById('adDescription').innerText = adDto.descriptionAd;
                        document.getElementById('adPrice').innerText = adDto.price;
                        document.getElementById('adPhone').innerText = adDto.phone;

                        // Creator
                        document.getElementById('creatorName').innerText = adDto.creatorName;
                        document.getElementById('creatorLink').href = `/publicUserProfil/html/publicUserProfil.html?userId=${adDto.creatorId}`;

                        // Photos
                        const adPhotosDiv = document.getElementById('adPhotos');
                        adPhotosDiv.innerHTML = ''; // Clear existing content
                        if (adDto.photos && adDto.photos.length > 0) {
                            const firstPhotoPath = adDto.photos[0]; // Get the first photo path
                            const img = document.createElement('img');
                            img.src = firstPhotoPath;
                            img.alt = 'Ad Photo';
                            img.style.maxWidth = '190px';
                            img.style.maxHeight = '190px';
                            adPhotosDiv.appendChild(img);
                        }

                        // More Photos List
                        const morePhotosList = document.getElementById('morePhotosList');
                        morePhotosList.innerHTML = '';
                        if (adDto.photos && adDto.photos.length > 0) {
                            adDto.photos.forEach(photoPath => {
                                const li = document.createElement('li');
                                const a = document.createElement('a');
                                a.href = photoPath; // Link to full-size image
                                const img = document.createElement('img');
                                img.src = photoPath;
                                img.alt = 'photo';
                                a.appendChild(img);
                                li.appendChild(a);
                                morePhotosList.appendChild(li);
                            });
                        } else {
                            morePhotosList.innerHTML = '<li>No additional photos.</li>';
                        }

                        var creatorId = adDto.creatorId;
                        var loggedUserId = adDto.loggedUserId;
                        var messageForm = document.getElementById('tableAdPage_message').parentNode;
                        var messageFormTitle = document.getElementById('tableAdPage__message__title');
                        var processAd = document.querySelector('.ProcessAd');
                        var tableMessagesAdPage = document.getElementById('tableMessagesAdPage');
                        isAdOwner = loggedUserId && creatorId === loggedUserId;

                        globalMessagesByAd[adId] = adDto.messageDtos || [];

                        if (!loggedUserId) {
                            messageForm.remove();
                            messageFormTitle.remove();
                            processAd.remove();
                            tableMessagesAdPage.remove();
                        } else if (globalMessagesByAd[adId].length > 0) {
                            if (isAdOwner) {
                                messageForm.remove();
                                messageFormTitle.remove();
                            } else {
                                processAd.remove();
                                messageForm.remove();
                                messageFormTitle.remove();
                            }
                            setMessagesCounterpartHeader(tableMessagesAdPage, isAdOwner);
                            displayMessagesByAd(tableMessagesAdPage, adId, 2);
                            const moreBtn = tableMessagesAdPage.querySelector(".moreMessages");
                            moreBtn.addEventListener("click", function () {
                                displayMessagesByAd(tableMessagesAdPage, adId, 2);
                            });
                        } else {
                            if (isAdOwner) {
                                messageForm.remove();
                                messageFormTitle.remove();
                            } else {
                                processAd.remove();
                            }
                            tableMessagesAdPage.remove();
                        }

                    })
                    .catch(error => {
                        console.error('Error fetching ad details:', error);
                        document.getElementById('adTitle').innerText = 'Error loading ad.';
                    });
            } else {
                console.error('adId not found in URL');
                document.getElementById('adTitle').innerText = 'Ad ID is missing.';
            }
        });

        function setMessagesCounterpartHeader(tableMessagesAdPage, isOwner) {
            const counterpartHeader = tableMessagesAdPage.querySelector(".table__messages__adPage__header__counterpart");
            if (counterpartHeader) {
                counterpartHeader.innerText = isOwner ? "купувач" : "продавач";
            }
        }
        function displayMessagesByAd(tableMessagesAdPage, adId, count) {
            const maxSymbols = 10;
            const moreMessagesRow = tableMessagesAdPage.querySelector(".more-messages-row");
            const messages = globalMessagesByAd[adId];

            if (!messages || messages.length === 0) {
                if (moreMessagesRow) {
                    moreMessagesRow.style.display = "none";
                }
                return;
            }

            const latestMessagesMap = new Map();
            messages.forEach(msg => latestMessagesMap.set(msg.communicationId, msg));
            const uniqueLatestMessages = Array.from(latestMessagesMap.values());

            if (!globalShownMessagesByAd[adId]) globalShownMessagesByAd[adId] = 0;
            const start = globalShownMessagesByAd[adId];
            const end = Math.min(start + count, uniqueLatestMessages.length);

            for (let j = start; j < end; j++) {
                const message = uniqueLatestMessages[j];
                const communicationId = message.communicationId;
                const newRow = tableMessagesAdPage.insertRow(-1);

                let text = message.text;
                text = text.length > maxSymbols ? text.substring(0, maxSymbols) + "..." : text;

                const more = document.createElement("BUTTON");
                more.innerText = "view more";
                more.classList.add("viewMoreThisCommunication");
                more.dataset.communicationId = communicationId;
                more.dataset.adId = adId;
                more.addEventListener("click", function () {
                    displayAllMessagesPerCommunicationId(this);
                });

                // Same order as купувачи, with продавач for buyers: person | date | sender | messages | view more
                newRow.insertCell(0).innerHTML = isAdOwner
                    ? message.communicationCreatorName
                    : message.adCreatorName;
                newRow.insertCell(1).innerHTML = message.date;
                newRow.insertCell(2).innerHTML = message.senderName;
                newRow.insertCell(3).innerHTML = text;
                newRow.insertCell(4).appendChild(more);

                const formRow = tableMessagesAdPage.insertRow(-1);
                const cell = formRow.insertCell(0);
                cell.colSpan = 4;
                cell.className = "tableAdPage_message--textarea";
                cell.innerHTML = `
<form method="POST" action="/addMessage" class="messageForm">
    <textarea class="tableAdPage_message--text" placeholder="напиши съобщение" name="text"></textarea>
    <input type="hidden" name="communicationId" value="${communicationId}">
    <input class="tableAdPage_message--send" type="submit" value="Изпращане">
</form>`;

                const spacerRow = tableMessagesAdPage.insertRow(-1);
                const spacerCell = spacerRow.insertCell(0);
                spacerCell.colSpan = 5;
                spacerCell.style.height = "10px";
                spacerCell.style.border = "none";
                spacerCell.style.backgroundColor = "transparent";
            }

            globalShownMessagesByAd[adId] = end;

            if (end < uniqueLatestMessages.length) {
                tableMessagesAdPage.appendChild(moreMessagesRow);
            } else if (moreMessagesRow) {
                moreMessagesRow.style.display = "none";
            }
        }

        function displayAllMessagesPerCommunicationId(viewMore) {
            const communicationId = viewMore.dataset.communicationId;
            const adId = viewMore.dataset.adId;
            const allMessages = globalMessagesByAd[adId];
            if (!allMessages) return;

            const filteredMessages = allMessages.filter(msg => msg.communicationId == communicationId);
            const template = document.getElementById("messagesAdPageTemplate");
            const tableMessagesTemplate = template.content.querySelector(".table__messages__adPage");
            const newClone = tableMessagesTemplate.cloneNode(true);
            newClone.className = "allMessagesAdPageOwner";

            filteredMessages.forEach(msg => {
                const row = newClone.insertRow(-1);
                row.insertCell(0).innerText = msg.date;
                row.insertCell(1).innerText = msg.senderName;
                row.insertCell(2).innerText = msg.text;
            });

            const formRow = newClone.insertRow(-1);
            const cell = formRow.insertCell(0);
            cell.colSpan = 3;
            cell.className = "tableAdPage_message--textarea";
            cell.innerHTML = `
<form method="POST" action="/addMessage" class="messageForm">
    <textarea class="tableAdPage_message--text" placeholder="напиши съобщение" name="text"></textarea>
    <input type="hidden" name="communicationId" value="${communicationId}">
    <input class="tableAdPage_message--send" type="submit" value="Изпращане">
</form>`;

            viewMore.parentElement.style.position = "relative";
            viewMore.style.background = "yellow";
            viewMore.parentElement.appendChild(newClone);

            setTimeout(() => {
                function outsideClickHandler(event) {
                    if (!newClone.contains(event.target) && event.target !== viewMore) {
                        newClone.remove();
                        viewMore.style.background = "pink";
                        document.removeEventListener("click", outsideClickHandler);
                    }
                }
                document.addEventListener("click", outsideClickHandler);
            }, 0);
        }

        // Attach a single, clean click listener for the edit button
        document.addEventListener("click", displayEditAd);
        deleteConfirmationListener();

        function deleteConfirmationListener() {
            const deleteButton = document.querySelector('#deleteAdLink');
            deleteButton.addEventListener('click', function (event) {
                event.stopPropagation(); // Prevent click from bubbling up
                displayDeleteConfirmationForm();
            });
        }
         function displayDeleteConfirmationForm() {

            // Avoid duplicates by checking if form is already in the DOM
            if (document.querySelector("#deleteAdLink #deleteConfirmationForm")) {
                return;
            }
            const template = document.querySelector("#deleteConfirmationFormTemplate");
            if (!template) {
                console.error("delete form template not found");
                return;
            }

            const clone = template.content.cloneNode(true);
            const deleteAdForm = clone.querySelector("#deleteConfirmationForm");
            document.getElementById("deleteAdLink").appendChild(deleteAdForm);
            removeElement(deleteAdForm);
            chooseFromDeleteForm(); // Call after appending to DOM
        }

        function chooseFromDeleteForm() {
            const form = document.querySelector("#deleteAdLink #deleteConfirmationForm");
            if (!form) {
                console.error("Logout form not found in DOM.");
                return;
            }

            // Get references to the specific "Yes" and "No" buttons
            const yesButton = form.querySelector('#deleteConfirmationForm__yes');
            const noButton = form.querySelector('#deleteConfirmationForm__no');

            // Attach click listener to the "Yes" button
            if (yesButton) {
                yesButton.addEventListener('click', function () {
                    deleteAd(); delete Ad
                    form.remove(); // Close the form after initiating delete ad
                    event.stopPropagation(); // Prevent click from bubbling up to delete ad
                });
            }
            // Attach click listener to the "No" button
            if (noButton) {
                noButton.addEventListener('click', function () {
                    console.log("delete ad 'No' button clicked. Closing form."); // For debugging
                    form.remove(); // Close the form without delete ad
                    event.stopPropagation(); // Prevent click from bubbling up to delete ad
                });
            }


        }

        function deleteAd() {
            const urlParams = new URLSearchParams(window.location.search);
            const adId = urlParams.get('adId');
            fetch(`/ad-delete?adId=${adId}`)
                .then(response => {
                    // Check the response status FIRST
                    if (response.status === 200) {
                        // If 200 OK, proceed to parse JSON
                        console.log("Ad with id = "+adId+" removed asuccessfully!");
                        alert("Ad with id = "+adId+" removed asuccessfully!"); // Display success message
                        window.location.reload();

                    }
                     return response.json();
                });
        }

        function removeElement(element) {

    // Detect outside click
    setTimeout(() => {  // timeout ensures it doesn't immediately trigger on same click
        function outsideClickHandler(event) {
            // Check if the clicked target is NOT the element itself,
            // AND NOT a descendant of the element.
            if (!element.contains(event.target)) {
                element.remove();
                document.removeEventListener("click", outsideClickHandler);
            }
        }
        document.addEventListener("click", outsideClickHandler);
    }, 0);
}

         document.addEventListener("submit", function (event) {
            if (event.target && event.target.matches("form[id='tableAdPage_message']")) {
                event.preventDefault(); // Prevents the page from reloading
                let formData = new FormData(event.target);

                const urlParams = new URLSearchParams(window.location.search);
                const adId = urlParams.get('adId');
                formData.append('adId', adId);

                fetch("/createMessage", {
                    method: "POST",
                    body: formData
                })
                    .then(response => {
                        if (response.ok) {
                            alert("Message sent successfully!");
                            window.location.reload();
                        } else {
                            alert("Error sending message.");
                        }
                    })
                    .catch(error => console.error("Error:", error));
            }

            if (event.target && event.target.matches("form[class='messageForm']")) {
                event.preventDefault();
                let formData = new FormData(event.target);

                fetch("/addMessage", {
                    method: "POST",
                    body: formData
                })
                    .then(response => {
                        if (response.ok) {
                            alert("Message sent successfully!");
                            window.location.reload();
                        } else {
                            alert("Error sending message.");
                        }
                    })
                    .catch(error => console.error("Error:", error));
            }
        });
    </script>
</body>

</html>
