<!DOCTYPE html>
<html>

<head>
    <title id="pageTitle">sergiya.bg</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="/adPage/css/style.css">
</head>

<body>
    <header class="headerSection">
        <h1><a href="/homePage/html/home.html">Сергия BG</a></h1>
    </header>
    <div class="advertisement">
        <table class="tableAdPage">
            <tr>
                <th class="tableAdPage__title">заглавие</th>
                <th>описание</th>
                <th>снимка</th>
                <th>потребител</th>
                <th>телефон</th>
                <th id="tableAdPage__message__title">съобщение</th>

            </tr>
            <tr>
                <td id="adTitle"></td>
                <td id="adDescription"></td>
                <td>
                    <div id="adPhotos"></div>
                </td>
                <td><a id="creatorLink" href="">
                        <p id="creatorName"></p>
                    </a></td>
                <td id="adPhone"></td>
                <td>
                    <form method="POST" action="/submit-form" id="tableAdPage_message">
                        <textarea class="tableAdPage_message--text" type="text" rows="4" cols="20"> </textarea>
                        <input class="tableAdPage_message--send" type="submit">
                    </form>
                </td>
                <td class="ProcessAd">
                    <table class="tableProcessAd">
                        <tr>
                            <td>
                                <button class="tableProcessAd__edit" id="editAdLink">редакция</button>
                            </td>

                        </tr>
                        <tr>
                            <td>
                                <button class="tableProcessAd__delete" id="deleteAdLink"> изтрий</button>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>

        <h2 class="morePhotos">още снимки</h2>
        <ol class="listPhotos" id="morePhotosList">
        </ol>
    </div>

    <template id="editAd__template">
        <div class="editAd">
            <h2 class="form-heading">редактиране на обява</h2>
            <table class="editAd__table">
                <form id="editAd__form" method="post" action="/edit-ad" enctype="multipart/form-data">
                    <tr>
                        <td>
                            <input type="text" name="title" placeholder="заглавие">
                        </td>
                        <td>
                            <textarea name="description" placeholder="описание"> </textarea>
                        </td>
                        <td>
                            <input type="text" name="price" placeholder="price">
                        </td>
                        <td>
                            <input type="number" name="phone" placeholder="телефон">
                        </td>
                        <td>
                            <input type="file" id="photos" name="photos" multiple accept="image/*">
                        </td>
                    </tr>
                    <tr>
                        <td class="emptyCell" style='border:none;     background-color: transparent;
    '>
                        </td>
                        <td>
                            <input type="submit" value="edit">
                        </td>
                        <td>
                            <a id="editAd__cancel" class="form-btn" href="/adPage/html/adPage.html">откажи</a>
                        </td>
                        <td class="emptyCell" style='border:none;     background-color: transparent;
  '>
                        </td>
                    </tr>
                </form>
            </table>
        </div>
    </template>

    <footer id="footerSection">

    </footer>

    <script>
        document.addEventListener('click', (event) => {
            var tableProcessAdEdit = document.querySelector('.tableProcessAd__edit');
            if (event.target === tableProcessAdEdit) {
                var tableAdPage = document.querySelector('.tableAdPage');
                var editAdTemplate = document.getElementById('editAd__template');
                var clone = editAdTemplate.content.cloneNode(true);
                tableAdPage.after(clone);

                const urlParams = new URLSearchParams(window.location.search);
                const adId = urlParams.get('adId');

                var editAdCancel = document.getElementById('editAd__cancel');
                editAdCancel.innerHTML = `<a href="/adPage/html/adPage.html?adId=${adId}">откажи</a>`;

            }
        });
    </script>
    <script>
        document.addEventListener("submit", function (event) {
            if (event.target && event.target.matches("form[id='editAd__form']")) {
                event.preventDefault(); // Prevents the page from reloading

                let formData = new FormData(event.target);

                fetch("/edit-ad", {
                    method: "POST",
                    body: formData
                })
                    .then(response => {
                        if (response.ok) {
                            alert("Ad edited successfully!");
                        } else if (response.status === 401) {
                            alert("The add was not edited because you are not logged in !");
                        } else {
                            alert("Error editing ad.");
                        }
                    })
                    .catch(error => console.error("Error:", error));
            }
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const adId = urlParams.get('adId');

            if (adId) {
                fetch(`/ad-details?adId=${adId}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(adDto => {
                        document.getElementById('pageTitle').innerText = adDto.titleAd;
                        document.getElementById('adTitle').innerText = adDto.titleAd;
                        document.getElementById('adDescription').innerText = adDto.descriptionAd;
                        document.getElementById('adPhone').innerText = adDto.phone;

                        // Creator
                        document.getElementById('creatorName').innerText = adDto.creatorName;
                        document.getElementById('creatorLink').href = `/publicUserProfil/html/publicUserProfil.html?userId=${adDto.creatorId}`;

                        // Photos
                        const adPhotosDiv = document.getElementById('adPhotos');
                        adPhotosDiv.innerHTML = ''; // Clear existing content
                        if (adDto.photos && adDto.photos.length > 0) {
                            const firstPhotoPath = adDto.photos[0]; // Get the first photo path
                            const img = document.createElement('img');
                            img.src = firstPhotoPath;
                            img.alt = 'Ad Photo';
                            img.style.maxWidth = '190px';
                            img.style.maxHeight = '190px';
                            adPhotosDiv.appendChild(img);
                        } else {
                            adPhotosDiv.innerHTML = '<img src="/adPage/img/default.jpg" alt="No photo" style="max-width: 190px; max-height: 190px;">';
                        }

                        // More Photos List
                        const morePhotosList = document.getElementById('morePhotosList');
                        morePhotosList.innerHTML = '';
                        if (adDto.photos && adDto.photos.length > 0) {
                            adDto.photos.forEach(photoPath => {
                                const li = document.createElement('li');
                                const a = document.createElement('a');
                                a.href = photoPath; // Link to full-size image
                                const img = document.createElement('img');
                                img.src = photoPath;
                                img.alt = 'photo';
                                a.appendChild(img);
                                li.appendChild(a);
                                morePhotosList.appendChild(li);
                            });
                        } else {
                            morePhotosList.innerHTML = '<li>No additional photos.</li>';
                        }

                        var creatorId = adDto.creatorId;
                        var loggedUserId = adDto.loggedUserId;
                        var messageForm = document.getElementById('tableAdPage_message').parentNode;
                        var messageFormTitle = document.getElementById('tableAdPage__message__title');
                        var processAd = document.querySelector('.ProcessAd');
                        if (!loggedUserId) {
                            messageForm.remove();
                            messageFormTitle.remove();
                            processAd.remove();
                        } else if (creatorId === loggedUserId) {
                            messageForm.remove();
                            messageFormTitle.remove();
                        } else {
                            processAd.remove();
                        }

                    })
                    .catch(error => {
                        console.error('Error fetching ad details:', error);
                        // Display an error message to the user
                        document.getElementById('adTitle').innerText = 'Error loading ad.';
                    });
            } else {
                console.error('adId not found in URL');
                document.getElementById('adTitle').innerText = 'Ad ID is missing.';
            }
        });
    </script>
</body>

</html>
