<!DOCTYPE html>
<html>

<head>
    <title>sergiya.bg</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="/publicUserProfil/css/style.css">
</head>

<body>
    <header class="headerSection">
        <h1><a href="/homePage/html/home.html">Сергия BG</a></h1>
    </header>
    <h2>
        обяви
    </h2>
    <table class="tablePageSelling">
        <tr>
            <th>заглавие</th>
            <th>снимка</th>
            <th>price</th>
            <th>потребител</th>
            <th>phone</th>
            <th id="tablePageSelling__favorite__header">favorite</th>
            <th id="tablePageSelling__message__header">съобщение</th>
        </tr>

    </table>

    <footer id="footerSection">

    </footer>

    <div id="imageModal" class="modal" onclick="this.style.display='none'">
        <span class="close">&times;</span>
        <img class="modal-content" id="fullImage">
    </div>

    <script src="/js/api.js"></script>
    <script>
        // 1. Get the userId from the browser's address bar
            const urlParams = new URLSearchParams(window.location.search);
            const publicProfileUserId = urlParams.get('userId');

            // 2. Build the request URL with that ID
            const requestUrl = `/publicUserProfil?userId=${publicProfileUserId}`;

            // 3. Invoke your backend
            getUrl(requestUrl, function (data) {
            var ads = JSON.parse(data);
            console.log(ads);
            var table = document.getElementsByClassName("tablePageSelling")[0];

            for (var i = 0; i < ads.length; i++) {
                var newRow = table.insertRow(i + 1);

                let ad = ads[i];
                let adId = ad.id;


                newRow.insertCell(0).innerHTML = `<a href="/adPage/html/adPage.html?adId=${adId}"><p>${ad.titleAd}</p></a>`;


            var photoPath = ad.photos.length > 0 ? ad.photos[0] : null;

            // Fix the backslashes if they are coming from the JSON source
            if (photoPath) {
                photoPath = photoPath.replace(/\\/g, '/');
            }

            // Add the onclick event and a cursor style to show it's clickable
            var photo = `<img src='${photoPath}' alt='obqva' width='300' height='300'
             onclick='openFullImage("${photoPath}")'
             style='cursor: zoom-in;'>`;
                newRow.insertCell(1).innerHTML = photo;

                var price = ad.price;
                newRow.insertCell(2).innerHTML = price === null ? "Price: 0" : "Price: " + price;

                var creatorAdId = parseInt(ad.creatorId);
                newRow.insertCell(3).innerHTML = `<a href='/publicUserProfil/html/publicUserProfil.html?userId=${creatorAdId}'><p>${ad.creatorName}</p></a>`;
                newRow.insertCell(4).innerHTML = ad.phone;

                var loggedUserId = ad.loggedUserId;

                if (loggedUserId !== null && creatorAdId !== loggedUserId) {

                    const favorite = document.createElement("p");
                    favorite.classList.add("favorite-icon");
                    favorite.innerText = ad.inFavorites ? "❤️" : "🤎"; // Filled heart for favorite, empty for not
                    favorite.style.opacity = ad.inFavorites ? "1" : "0.45";

                    favorite.addEventListener("click", function () {
                        // Toggle favorite status
                        if (favorite.innerText === "❤️") {
                            removeFavorite(adId);
                            favorite.innerText = "🤎";
                            favorite.style.opacity = "0.45";
                        } else {
                            addFavorite(adId);
                            favorite.innerText = "❤️";
                            favorite.style.opacity = "1";
                        }
                    });

                    newRow.insertCell(5).appendChild(favorite);

                    newRow.insertCell(6).innerHTML = `
                <form method="POST" action="/createMessage" id='tablePageSelling_message' >
                    <textarea class="tablePageSelling_message--text" name="text" rows="4" cols="20"></textarea>
                    <input type="hidden" name="adId" value="${adId}">
                    <input type="hidden" name="creatorAdId" value="${creatorAdId}">
                    <input class="tablePageSelling_message--send" type="submit">
                </form>
                `;
                } else {
                    document.getElementById("tablePageSelling__favorite__header")?.remove();
                    document.getElementById("tablePageSelling__message__header")?.remove();

                }

            }
        });
        function openFullImage(src) {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("fullImage");

            modal.style.display = "block";
            modalImg.src = src;
        }

        document.addEventListener("submit", function (event) {
            if (event.target && event.target.matches("form[id='tablePageSelling_message']")) {
                event.preventDefault(); // Prevents the page from reloading

                let formData = new FormData(event.target);

                fetch("/createMessage", {
                    method: "POST",
                    body: formData
                })
                    .then(response => {
                        if (response.ok) {
                            alert("Message sent successfully!");
                        } else {
                            alert("Error sending message.");
                        }
                    })
                    .catch(error => console.error("Error:", error));
            }
        });


 function addFavorite(adId) {

            const body = {
                adId: adId
            };

            fetch("/add-in-favorites", {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            })
                .then(response => {
                    if (response.ok) {
                        alert("Ad with id " + adId + " added to favorites successfully!");
                    } else {
                        alert("Error sending message.");
                    }
                })
                .catch(error => console.error("Error:", error));
        }


        function removeFavorite(adId) {

            const body = {
                adId: adId
            };

            fetch("/remove-from-favorites", {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            })
                .then(response => {
                    if (response.ok) {
                        alert("Ad with id " + adId + " removed from favorites successfully!");
                    } else {
                        alert("Error sending message.");
                    }
                })
                .catch(error => console.error("Error:", error));
        }
    </script>
</body>
