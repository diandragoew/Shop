<!DOCTYPE html>
<html>
<head>
    <title>sergiya.bg</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="/createAd/css/style.css">
</head>
<body>
<header class="headerSection">
    <h1><a href="/homePage/html/home.html">Сергия BG</a></h1>
</header>
<div class="createAd">
    <h2 class="form-heading">създаване на обява</h2>
    <table class="createAd__table">
        <form id="createAd__form" method="post" action="/create-ad" enctype="multipart/form-data">
            <tr>
                <td>
                    <input type="name" name="title" placeholder="заглавие">
                </td>
                <td>
                    <textarea name="description" placeholder="описание"> </textarea>
                </td>
                <td>
                    <input type="number" name="phone" placeholder="телефон">
                </td>
                <td>
                    <input type="file" id="photos" name="photos" multiple accept="image/*" >
                </td>
            </tr>
            <tr>
                <td class="emptyCell" style='border:none;     background-color: transparent;
    '>
                </td>
                <td>
                    <input type="submit" value="създай">
                </td>
                <td>
                    <a class="form-btn" href="/userProfil/html/userProfile.html">откажи</a>
                </td>
                <td class="emptyCell" style='border:none;     background-color: transparent;
  '>
                </td>
            </tr>
        </form>
    </table>
</div>

<footer id="footerSection">

</footer>


<script >
    document.addEventListener("submit", function(event) {
    if (event.target && event.target.matches("form[id='createAd__form']")) {
        event.preventDefault(); // Prevents the page from reloading

        let formData = new FormData(event.target);

        fetch("/create-ad", {
            method: "POST",
            body: formData
        })
        .then(response => {
            if (response.ok) {
                alert("Message sent successfully!");
            } else if (response.status === 401) {
                alert("The add was not created because you are not logged in !");
            } else {
                alert("Error sending message.");
            }
        })
        .catch(error => console.error("Error:", error));
    }
});
</script>

</body>
</html>
