<!DOCTYPE html>
<html>
<head>
	<title>sergiya.bg</title>
	<meta charset="utf-8">
	<link rel="stylesheet" type="text/css" href="/loginPage/css/style.css">
</head>
<body>
	<header class="headerSection">

		  <h1><a href="/homePage/html/home.html">Сергия BG</a></h1>
		<table class="headerSection__table">
			<td>
				<div class="headerSection__createAd">
					<a  href="/createAd/html/createAd.html"><p>create ad</p></a>
				</div>
			</td>
			<td>

				<div class="headerSection__myProfile">
					<a  href="/userProfil/html/userProfile.html"><p>my profil или create profil(според това дали си логнат или не)</p></a>
				</div>
			</td>
			<td>

			<div class="headerSection__login">
					<a  href="/loginPage/html/loginPage.html"><p>вход или изход(според това дали си логнат или не)</p></a>
				</div>
			</td>
		</table>
	</header>
	<div class="selling">
		<a class="selling__picture--link" title="pageSelling" href="/pageSelling/html/pageSelling.html"> <img class="selling_picture" src="/loginPage/img/1.png" alt="selling picture" width="500" height="500">
		</a>
	</div>
	<form class="loginForm" method="POST" action="/login" id="loginForm">
		<input class="loginForm__credentials" type="text" id="name" name="userName" placeholder="name">
		<input class="loginForm__credentials" type="password" id="pass" name="password" placeholder="password">
		<input class="loginForm__enter" type="submit" value="влез">
	</form>

	<footer id="footerSection">

	</footer>


	<script>
		document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent default form submission

            const loginData = {
                userName: document.getElementById("name").value,
                password: document.getElementById("pass").value
            };

            console.log("Sending login request:", loginData);

            fetch("http://localhost:8080/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(loginData)
            })
            .then(response => response.json())
            .then(data => console.log("Login successful:", data))
            .catch(error => console.error("Error:", error));
        });
	</script>

</body>
</html>
