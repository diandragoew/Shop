<!DOCTYPE html>
<html>

<head>
    <title>sergiya.bg</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="/userProfil/css/style.css">


</head>

<body>
    <header class="headerSection">
        <h1><a href="/homePage/html/home.html">Сергия BG</a></h1>
    </header>

    <div class="userProfil">

        <div class="ads">
            <h2>обяви</h2>

            <div class="sells">
                <h3>продавам</h3>
            </div>

            <div class="buys">
                <h3>купувам</h3>
            </div>


            <div class="adsSellsAndMessages" id="adsContainer">
                <template id="adTemplate">
                    <div class="adBlock">
                        <table class="table__sells">
                            <tr>
                                <th>заглавие на обявата</th>
                                <th>описание на обявата</th>
                                <th>основна снимка</th>
                            </tr>
                        </table>

                        <table class="table__messages__sells">
                            <tr>
                                <th colspan="3" style="text-align: center;">съобщения</th>
                            </tr>
                            <tr>
                                <th>date</th>
                                <th>sender</th>
                                <th>messages</th>
                            </tr>
                            <tr class="more-messages-row">
                                <td colspan="3" style="text-align: left;">
                                    <button class="moreMessages">още съобщения...</button>
                                </td>
                            </tr>
                        </table>
                    </div>
                </template>
            </div>


        </div>

    </div>
    <footer id="footerSection">

    </footer>
    <script src="/js/api.js"></script>
    <script>
        var globalMessagesByAd = [];  // Declare a global array to store messages by ad index or id

        var globalShownMessagesByAd = {}; // Track how many messages are shown per ad


        getUrl("/profile", function (data) {
            var user = JSON.parse(data);
            var id = user.id;
            var userName = user.userName;
            console.log(userName);

            var sellAdDtos = user.sellAdDtos;
            console.log(sellAdDtos);

            const template = document.getElementById("adTemplate");

            for (var i = 0; i < sellAdDtos.length; i++) {
                let messages = sellAdDtos[i].messageDtos;
                globalMessagesByAd[sellAdDtos[i].id] = messages;

                let adId = sellAdDtos[i].id;


                const newClone = template.content.cloneNode(true);
                document.getElementById("adsContainer").appendChild(newClone);

                const tableSells = document.getElementsByClassName("table__sells")[i];
                const tableSellsMessages = document.getElementsByClassName("table__messages__sells")[i];

                var newRowTableSells = tableSells.insertRow(1);

                newRowTableSells.insertCell(0).innerHTML = sellAdDtos[i].title;
                newRowTableSells.insertCell(1).innerHTML = sellAdDtos[i].description;

                var photoPath = sellAdDtos[i].photos.length > 0 ? sellAdDtos[i].photos[0].photoPath : null;
                var photo = "<img src='" + photoPath + "' alt='obqva' width='190' height='190'>"
                newRowTableSells.insertCell(2).innerHTML = photo;

                displayMessagesByAd(tableSellsMessages, adId, 2); // show first 2

                const moreBtn = tableSellsMessages.querySelector(".moreMessages");
                moreBtn.addEventListener("click", function () {
                    displayMessagesByAd(tableSellsMessages, adId, 2); // load 2 more
                });
            }
        });

        function displayMessagesByAd(tableSellsMessages, adId, count) {
            const maxSymbols = 10;

            const messages = globalMessagesByAd[adId];
            if (!messages || messages.length === 0) return;

            // Keep only the last message per communicationId (since they're in order)
            const latestMessagesMap = new Map();
            messages.forEach(msg => latestMessagesMap.set(msg.communicationId, msg));

            const uniqueLatestMessages = Array.from(latestMessagesMap.values());

            if (!globalShownMessagesByAd[adId]) globalShownMessagesByAd[adId] = 0;
            const start = globalShownMessagesByAd[adId];
            const end = Math.min(start + count, uniqueLatestMessages.length);

            for (let j = start; j < end; j++) {
                const message = uniqueLatestMessages[j];

                const newRowTableSellsMessages = tableSellsMessages.insertRow(-1);

                newRowTableSellsMessages.insertCell(0).innerHTML = message.date;
                newRowTableSellsMessages.insertCell(1).innerHTML = message.senderName;

                let text = message.text;
                text = text.length > maxSymbols ? text.substring(0, maxSymbols) + "..." : text;
                newRowTableSellsMessages.insertCell(2).innerHTML = text;

                const more = document.createElement("BUTTON");
                more.innerText = "view more";
                more.classList.add("viewMoreThisCommunication");
                more.dataset.communicationId = message.communicationId;
                more.dataset.adId = adId; // hidden attribute as requested
                newRowTableSellsMessages.insertCell(3).appendChild(more);

                more.addEventListener("click", function () {
                    displayAllMessagesPerCommunicationId(this);
                });

                const formRow = tableSellsMessages.insertRow(-1);
                const cell = formRow.insertCell(0);
                cell.colSpan = 3;
                cell.className = "tablePageSelling_message--textarea";
                cell.innerHTML = `
    <form method="POST" action="/createMessage" class="messageForm">
        <textarea class="tablePageSelling_message--text" placeholder="напиши съобщение" name="text"></textarea>
        <input class="tablePageSelling_message--send" type="submit" value="Изпращане">
    </form>
`;
            }

            globalShownMessagesByAd[adId] = end;

            const moreMessagesRow = tableSellsMessages.querySelector(".more-messages-row");
            if (end < uniqueLatestMessages.length) {
                tableSellsMessages.appendChild(moreMessagesRow);
            } else if (moreMessagesRow) {
                moreMessagesRow.style.display = "none";
            }
        };
        function displayAllMessagesPerCommunicationId(viewMore) {
            const communicationId = viewMore.dataset.communicationId;

            // NEW: find the adId from dataset
            const adId = viewMore.dataset.adId;
            const allMessages = globalMessagesByAd[adId];

            if (!allMessages) return;

            // NEW: filter messages matching the communicationId
            const filteredMessages = allMessages.filter(msg => msg.communicationId == communicationId);



            // Clone and prepare the message display
            const template = document.getElementById("adTemplate");
            const tableMessagesTemplate = template.content.querySelector(".table__messages__sells");
            const newClone = tableMessagesTemplate.cloneNode(true);
            newClone.className = "allMessages";
            // Remove the "more messages" row
            const moreMessagesRow = newClone.querySelector(".more-messages-row");
            if (moreMessagesRow) {
                moreMessagesRow.remove();
            }

            // Optionally, fill the cloned table with the full messages
            const messagesTableBody = newClone;
            filteredMessages.forEach(msg => {
                const row = messagesTableBody.insertRow(-1);
                row.insertCell(0).innerText = msg.date;
                row.insertCell(1).innerText = msg.senderName;
                row.insertCell(2).innerText = msg.text;
            });
            const formRow = messagesTableBody.insertRow(-1);
            const cell = formRow.insertCell(0);
            cell.colSpan = 3;
            cell.className = "tablePageSelling_message--textarea";
            cell.innerHTML = `
    <form method="POST" action="/createMessage" class="messageForm">
        <textarea class="tablePageSelling_message--text" placeholder="напиши съобщение" name="text"></textarea>
        <input class="tablePageSelling_message--send" type="submit" value="Изпращане">
    </form>
`;
            viewMore.parentElement.style.position = "relative";
            viewMore.style.background = "yellow";

            viewMore.parentElement.appendChild(newClone);

                // Detect outside click
    setTimeout(() => {  // timeout ensures it doesn't immediately trigger on same click
        function outsideClickHandler(event) {
            if (!newClone.contains(event.target) && event.target !== viewMore) {
                newClone.remove();
                viewMore.style.background = "pink"; // Restore color
                document.removeEventListener("click", outsideClickHandler);
            }
        }
        document.addEventListener("click", outsideClickHandler);
    }, 0);
        }


    </script>
</body>

</html>
