<!DOCTYPE html>
<html>

<head>
    <title>sergiya.bg</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="/userProfil/css/style.css">
</head>

<body>
    <header class="headerSection">
        <h1><a href="/homePage/html/home.html">Сергия BG</a></h1>
    </header>

    <div class="userProfil">

        <div class="ads">
            <h2>обяви</h2>

            <div class="sells">
                <h3>продавам</h3>
            </div>

            <div class="buys">
                <h3>купувам</h3>
            </div>


            <div class="adsSellsAndMessages">

                <table class="table__sells">
                    <tr>

                        <th>заглавие на обявата</th>
                        <th>описание на обявата</th>
                        <th>основна снимка</th>
                    </tr>
                </table>

                <table class="table__messages__sells">
                    <tr>
                        <th colspan="3" style="text-align: center;">съобщения</th>
                    </tr>

                    <tr>
                        <th>date</th>
                        <th>sender</th>
                        <th>messages</th>
                    </tr>

                    <tr>
                        <td colspan="3" style="text-align: left;">
                            <button>още съобщения...</button>
                        </td>
                    </tr>

                </table>
            </div>


        </div>

    </div>
    <footer id="footerSection">

    </footer>
    <script src="/js/api.js"></script>
    <script>
        getUrl("/profile", function (data) {
            var user = JSON.parse(data);
            var id = user.id;
            var userName = user.userName;
            console.log(userName);

            var sellAdDtos = user.sellAdDtos;
            console.log(sellAdDtos);

            var tableSells = document.getElementsByClassName("table__sells")[0];

            var tableSellsMessages = document.getElementsByClassName("table__messages__sells")[0];


            for (var i = 0; i < sellAdDtos.length; i++) {

                var newRowTableSells = tableSells.insertRow(i + 1);

                newRowTableSells.insertCell(0).innerHTML = sellAdDtos[i].title;
                newRowTableSells.insertCell(1).innerHTML = sellAdDtos[i].description;

                var photoPath = sellAdDtos[i].photos.length > 0 ? sellAdDtos[i].photos[0].photoPath : null;
                var photo = "<img src='" + photoPath + "' alt='obqva' width='190' height='190'>"
                newRowTableSells.insertCell(2).innerHTML = photo;

                var messages = sellAdDtos[i].messageDtos;
                var hardcodedRowsOfTableSellsMessages = 2;
                for (var j = 0; j < messages.length; j++) {
                    var message = messages[j];

                    var newRowTableSellsMessages = tableSellsMessages.insertRow(j + hardcodedRowsOfTableSellsMessages);

                    var date = message.date;
                    newRowTableSellsMessages.insertCell(0).innerHTML = date;

                    var senderName = message.senderName;
                    newRowTableSellsMessages.insertCell(1).innerHTML = senderName;

                    var text = message.text;
                    newRowTableSellsMessages.insertCell(2).innerHTML = text;

                    var more = document.createElement("BUTTON");
                    more.innerText = "view more";
                    newRowTableSellsMessages.insertCell(3).appendChild(more);

                    newRowTableSellsMessages = tableSellsMessages.insertRow(j + (++hardcodedRowsOfTableSellsMessages));

                    newRowTableSellsMessages.innerHTML = `
                    <tr>
                    <td colspan="3">
                    <form method="POST" action="/createMessage" id="tablePageSelling_message">
                        <textarea class="tablePageSelling_message--text" placeholder = "напиши съобщение" name="text"></textarea>
                        <input class="tablePageSelling_message--send" type="submit">
                    </form>
                    </td>
                    </tr>
                    `;
                }

            }
        });
    </script>
</body>

</html>
