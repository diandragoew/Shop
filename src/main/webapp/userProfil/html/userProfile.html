<!DOCTYPE html>
<html>

<head>
    <title>sergiya.bg</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="/userProfil/css/style.css">
</head>

<body>
<header class="headerSection">
    <h1><a href="/homePage/html/home.html">Сергия BG</a></h1>
</header>

<div class="userProfil">

    <div class="ads">
        <h2>обяви</h2>

        <div class="sells">
            <h3>продавам</h3>
        </div>

        <div class="buys">
            <h3>купувам</h3>
        </div>


        <div class="adsSellsAndMessages">

            <table class="table__sells">
                <tr>

                    <th>заглавие на обявата</th>
                    <th>описание на обявата</th>
                    <th>основна снимка</th>
                </tr>
            </table>

            <table class="table__messages__sells">
                <tr>
                    <th>съобщения</th>
                </tr>

                <tr>
                    <td>
                        <table>
                            <tr>
                                <th>date</th>
                                <th>sender</th>
                                <th>messages</th>
                            </tr>
                            <tr>
                                <td>
                                    <p>04.05.2020</p>
                                </td>
                                <td>

                                    <a href="/publicUserProfil/html/publicUserProfil.html">
                                        <p>iivanov</p>
                                    </a>
                                </td>
                                <td>
                                    <p>здравей, искам да я купя</p>
                                </td>
                            </tr>

                            <tr>
                                <td>
                                    <p>още съобщения...</p>
                                </td>
                            </tr>

                        </table>
                    </td>

                </tr>
            </table>
        </div>


    </div>

</div>
<footer id="footerSection">

</footer>
<script src="/js/api.js"></script>
<script>
    getUrl("/profile", function (data) {
        var user = JSON.parse(data);
        var userName = user.userName;
        console.log(userName);
        var ads = user.ads;
        console.log(ads);

        var tableSells = document.getElementsByClassName("table__sells")[0];

        var tableSellsMessages = document.getElementsByClassName("table__messages__sells")[0];


        for (var i = 0; i < ads.length; i++) {

            var newRowTableSells = tableSells.insertRow(i + 1);

            newRowTableSells.insertCell(0).innerHTML = ads[i].title;
            newRowTableSells.insertCell(1).innerHTML = ads[i].description;

            var photoPath = ads[i].photos.length > 0 ? ads[i].photos[0].photoPath : null;
            var photo = "<img src='" + photoPath + "' alt='obqva' width='190' height='190'>"
            newRowTableSells.insertCell(2).innerHTML = photo;

            var messages = ads[i].messages;
         for (var j = 0; j < messages.length; j++) {
            var message = messages[j];

            var newRowTableSellsMessages = tableSellsMessages.insertRow(j + 1);

            var date = message.date;
            newRowTableSellsMessages.insertCell(0).innerHTML = date;

            var sender = message.sender.userName;
            newRowTableSellsMessages.insertCell(1).innerHTML = sender;

            var message = message.text;
            newRowTableSellsMessages.insertCell(2).innerHTML = message;
         }

        }
    });
</script>
</body>

</html>
