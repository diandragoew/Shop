    <footer id="footerSection">

    </footer>
    <script src="/js/api.js"></script>
    <script>
        getUrl("/profile", function (data) {
            var user = JSON.parse(data);
            var userName = user.userName;
            console.log(userName);
            var ads = user.ads;
            console.log(ads);
            var table = document.getElementsByClassName("table__ads")[0];

            for (var i = 0; i < ads.length; i++) {

                var newRow = table.insertRow(i + 1);

                newRow.insertCell(0).innerHTML = ads[i].title;
                newRow.insertCell(1).innerHTML = ads[i].description;

                var photoPath = ads[i].photos.length > 0 ? ads[i].photos[0].photoPath : null;
                var photo = "<img src='" + photoPath + "' alt='obqva' width='300' height='300'>"
                newRow.insertCell(2).innerHTML = photo;
            }
        });
    </script>
</body>
